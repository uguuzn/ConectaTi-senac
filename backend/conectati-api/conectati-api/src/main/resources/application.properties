spring.application.name=conectati-api
spring.profiles.default=local
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/,file:./static/}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectati}
spring.datasource.username=${DB_USERNAME:conectati}
spring.datasource.password=${DB_PASSWORD:conectati}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em ambiente academico, o Hibernate cria/atualiza o esquema automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Configuráveis no ambiente Vercel para o serviço /api.
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
server.port=${PORT:8080}
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
