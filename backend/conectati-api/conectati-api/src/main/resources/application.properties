spring.application.name=conectati-api
server.port=${PORT:8080}
spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/,file:./static/}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conectati}
spring.datasource.username=${DB_USERNAME:conectati}
spring.datasource.password=${DB_PASSWORD:conectati}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool reduzido para o plano gratuito e para o Neon, que suspende o compute ocioso.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Em ambiente academico, o Hibernate cria/atualiza o esquema automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:local-development-only-change-before-deploy-32chars-minimum}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

# Configure APP_CORS_ALLOWED_ORIGINS com as origens exatas dos frontends publicados.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173}

# Health check HTTP usado pelo Render. Liveness não depende do banco externo.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
