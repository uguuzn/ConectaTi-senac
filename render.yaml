# API Spring Boot gratuita no Render; o Postgres de demonstração fica no Neon.
# Cadastre DB_URL, DB_USERNAME, DB_PASSWORD e APP_CORS_ALLOWED_ORIGINS no primeiro deploy.
services:
  - type: web
    name: conectati-api
    runtime: docker
    plan: free
    rootDir: backend/conectati-api/conectati-api
    dockerfilePath: backend/conectati-api/conectati-api/Dockerfile
    dockerContext: backend/conectati-api/conectati-api
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: APP_AUTH_TOKEN_SECRET
        sync: false
      - key: APP_DEMO_DATA_ENABLED
        value: "false"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
