<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConectaTI Senac — Novo chamado</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app">
 <aside class="sidebar" id="sidebar">
 <div class="brand">
 <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
 <span class="brand-name">Conecta<b>TI</b></span>
 </div>
 <nav>
 <a href="home.html">Início</a>
 <a href="dashboard.html">Dashboard</a>
 <a href="chamados.html">Chamados</a>
 <a href="novo-chamado.html" class="active">Novo chamado</a>
 <a href="equipamentos.html">Equipamentos</a>
 <a href="relatorios.html">Relatórios</a>
 <a href="minhas-turmas.html">Minhas turmas</a>
 <a href="mapa-salas.html">Mapa de salas</a>
 <a href="usuarios.html">Usuários</a>
 <a href="unidades.html">Unidades</a>
 <a href="login.html" class="logout">Sair</a>
 </nav>
 </aside>

 <main class="content">
 <header class="topbar">
 <button class="menu-toggle" id="menu-toggle">Menu</button>
 <div>
 <h1>Abrir novo chamado</h1>
 <p class="muted">Descreva sua solicitação com o máximo de detalhes.</p>
 </div>
 </header>

 <section class="card reveal">
 <form id="form-chamado" class="form form-grid" novalidate>
 <label>Nome do solicitante <input type="text" id="nome" required /></label>
 <label>Perfil
 <select id="perfil-solicitante" required>
 <option value="">Selecione</option>
 <option>Instrutor</option>
 <option>Suporte TI</option>
 <option>Coordenação</option>
 <option>Administrador</option>
 </select>
 </label>
 <label>Turma (se instrutor) <input type="text" id="turma" placeholder="Ex.: TI 2024/2" /></label>
 <label>Sala / Laboratório <input type="text" id="sala" required /></label>
 <label>Categoria
 <select id="categoria" required>
 <option value="">Selecione</option>
 <option>Reserva de notebooks</option>
 <option>Problema com internet</option>
 <option>Projetor</option>
 <option>Computador com defeito</option>
 <option>Instalação de software</option>
 <option>Impressora</option>
 <option>Cabo HDMI ou adaptador</option>
 <option>Mouse</option>
 <option>Teclado</option>
 <option>Carregador</option>
 <option>Sistema acadêmico</option>
 <option>Outros</option>
 </select>
 </label>
 <label>Prioridade
 <select id="prioridade" required>
 <option value="">Selecione</option>
 <option>Baixa</option>
 <option>Média</option>
 <option>Alta</option>
 <option>Urgente</option>
 </select>
 </label>
 <label>Data <input type="date" id="data" required /></label>
 <label>Horário <input type="time" id="hora" required /></label>
 <label class="full">Descrição do problema
 <textarea id="descricao" rows="5" required placeholder="Descreva o problema..."></textarea>
 </label>
 <div id="alerta-chamado" class="alerta hidden full"></div>
 <div class="full actions-row">
 <button type="reset" class="btn btn-outline">Limpar</button>
 <button type="submit" class="btn btn-primary">Enviar chamado</button>
 </div>
 </form>
 </section>
 </main>

 <script src="js/script.js"></script>
</body>
</html>
