<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d4da2">
    <title>Usuários - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo-senac.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .btn-add {
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(107, 203, 119, 0.3); }
        
        .user-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .user-status.active { background: rgba(107, 203, 119, 0.15); color: #6BCB77; }
        .user-status.inactive { background: rgba(255, 71, 87, 0.15); color: #FF4757; }
        .user-status.pending { background: rgba(255, 179, 71, 0.15); color: #FFB347; }
        
        .user-avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img class="logo" src="assets/logo-senac.png" alt="Logo Senac">
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
            <a href="novo-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Novo Chamado</a>
            </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">caioricardo284</div>
                    <div class="user-perfil" id="userPerfil">Administrador</div>
                    <div class="user-perfil" id="userUnidade">Taguatinga</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">🌓 Tema</button>
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm" style="width:100%;">🚪 Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>👤 Usuários</h1>
                <p>Gerencie os usuários do sistema</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <button class="btn-add" onclick="mostrarNotificacao('Novo usuário criado!', 'success')">+ Novo Usuário</button>
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="filtros-container">
            <div class="busca">
                <span class="icone">🔍</span>
                <input type="text" placeholder="Buscar usuários..." oninput="filtrarUsuarios()" id="buscaUsuarios">
            </div>
            <select id="filtroPerfil" onchange="filtrarUsuarios()">
                <option value="todos">Todos os Perfis</option>
                <option value="Administrador">Administrador</option>
                <option value="Instrutor">Instrutor</option>
                <option value="Suporte TI">Suporte TI</option>
                <option value="Coordenacao">Coordenação</option>
            </select>
            <select id="filtroStatusUser" onchange="filtrarUsuarios()">
                <option value="todos">Todos Status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
                <option value="Pendente">Pendente</option>
            </select>
        </div>

        <div class="tabela-wrapper">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Unidade</th>
                        <th>Status</th>
                        <th>Data Cadastro</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
        <p style="padding: 0 24px 16px; font-size:0.75rem; color:var(--text-muted);" id="resultadoContador">Mostrando 8 usuários</p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
    <script>
        const usuarios = [
            { nome: 'Caio Ricardo', email: 'caio@senac.com', perfil: 'Administrador', unidade: 'Taguatinga', status: 'Ativo', data: '01/01/2026' },
            { nome: 'Rayssa Paiva', email: 'rayssa@senac.com', perfil: 'Instrutor', unidade: 'Taguatinga', status: 'Ativo', data: '15/01/2026' },
            { nome: 'João Suporte', email: 'joao@senac.com', perfil: 'Suporte TI', unidade: 'Brasília', status: 'Ativo', data: '20/01/2026' },
            { nome: 'Carla Mendes', email: 'carla@senac.com', perfil: 'Coordenacao', unidade: 'Ceilândia', status: 'Ativo', data: '25/01/2026' },
            { nome: 'Ana Souza', email: 'ana@senac.com', perfil: 'Instrutor', unidade: 'Gama', status: 'Pendente', data: '01/02/2026' },
            { nome: 'Pedro Santos', email: 'pedro@senac.com', perfil: 'Suporte TI', unidade: 'Taguatinga', status: 'Inativo', data: '10/02/2026' },
            { nome: 'Mariana Lima', email: 'mariana@senac.com', perfil: 'Coordenacao', unidade: 'Planaltina', status: 'Ativo', data: '15/02/2026' },
            { nome: 'Lucas Ferreira', email: 'lucas@senac.com', perfil: 'Instrutor', unidade: 'Samambaia', status: 'Pendente', data: '20/02/2026' }
        ];

        function getBadgeStatusUser(status) {
            const classes = { 'Ativo': 'active', 'Inativo': 'inactive', 'Pendente': 'pending' };
            return `<span class="user-status ${classes[status] || 'pending'}">${status}</span>`;
        }

        function getAvatarColor(nome) {
            const cores = ['#0d4da2', '#f37021', '#FFD93D', '#6BCB77', '#4D96FF', '#FFB347', '#FF4757', '#A29BFE'];
            return cores[nome.length % cores.length];
        }

        function exibirUsuarios() {
            const tbody = document.getElementById('listaUsuarios');
            const busca = document.getElementById('buscaUsuarios')?.value.toLowerCase() || '';
            const perfil = document.getElementById('filtroPerfil')?.value || 'todos';
            const status = document.getElementById('filtroStatusUser')?.value || 'todos';

            let filtrados = usuarios.filter(u => {
                const matchBusca = u.nome.toLowerCase().includes(busca) || u.email.toLowerCase().includes(busca);
                const matchPerfil = perfil === 'todos' || u.perfil === perfil;
                const matchStatus = status === 'todos' || u.status === status;
                return matchBusca && matchPerfil && matchStatus;
            });

            tbody.innerHTML = filtrados.map(u => `
                <tr>
                    <td>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div class="user-avatar-sm" style="background:${getAvatarColor(u.nome)}">${u.nome.charAt(0)}</div>
                            <strong>${u.nome}</strong>
                        </div>
                    </td>
                    <td>${u.email}</td>
                    <td>${u.perfil}</td>
                    <td>${u.unidade}</td>
                    <td>${getBadgeStatusUser(u.status)}</td>
                    <td>${u.data}</td>
                </tr>
            `).join('');

            const contador = document.getElementById('resultadoContador');
            if (contador) contador.textContent = `Mostrando ${filtrados.length} usuário${filtrados.length > 1 ? 's' : ''}`;
        }

        function filtrarUsuarios() { exibirUsuarios(); }

        // A listagem efetiva é inicializada abaixo, a partir da API.
    </script>
    <script>
        let usuariosDaApi = [];
        const tiposPorFiltro = { 'Administrador': 'ADMIN', 'Instrutor': 'PROFESSOR', 'Suporte TI': 'TECNICO', 'Coordenacao': 'ALUNO' };

        function tipoLegivel(tipo) {
            return { ADMIN: 'Administrador', TECNICO: 'Técnico', PROFESSOR: 'Professor', ALUNO: 'Aluno' }[tipo] || tipo || '—';
        }

        function celula(texto) {
            const td = document.createElement('td');
            td.textContent = texto ?? '—';
            return td;
        }

        function renderizarUsuariosDaApi() {
            const tbody = document.getElementById('listaUsuarios');
            if (!tbody) return;
            const busca = document.getElementById('buscaUsuarios')?.value.trim().toLowerCase() || '';
            const tipo = document.getElementById('filtroPerfil')?.value || 'todos';
            const status = document.getElementById('filtroStatusUser')?.value || 'todos';
            const filtrados = usuariosDaApi.filter((usuario) => {
                const correspondeBusca = [usuario.nome, usuario.email].some((valor) => (valor || '').toLowerCase().includes(busca));
                const correspondeTipo = tipo === 'todos' || usuario.tipo === tiposPorFiltro[tipo];
                const correspondeStatus = status === 'todos' || (status === 'Ativo' ? usuario.ativo : !usuario.ativo);
                return correspondeBusca && correspondeTipo && correspondeStatus;
            });

            tbody.replaceChildren();
            if (!filtrados.length) {
                const linha = document.createElement('tr');
                const vazio = celula('Nenhum usuário encontrado.');
                vazio.colSpan = 6;
                linha.appendChild(vazio);
                tbody.appendChild(linha);
            } else {
                filtrados.forEach((usuario) => {
                    const linha = document.createElement('tr');
                    linha.append(celula(usuario.nome), celula(usuario.email), celula(tipoLegivel(usuario.tipo)), celula('—'), celula(usuario.ativo ? 'Ativo' : 'Inativo'), celula('—'));
                    tbody.appendChild(linha);
                });
            }
            const contador = document.getElementById('resultadoContador');
            if (contador) contador.textContent = `Mostrando ${filtrados.length} usuário${filtrados.length === 1 ? '' : 's'}`;
        }

        function filtrarUsuarios() { renderizarUsuariosDaApi(); }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                usuariosDaApi = await ConectaTIAPI.listarUsuarios();
                renderizarUsuariosDaApi();
            } catch (error) {
                const tbody = document.getElementById('listaUsuarios');
                if (tbody) {
                    tbody.replaceChildren();
                    const linha = document.createElement('tr');
                    const mensagem = celula(error.message);
                    mensagem.colSpan = 6;
                    linha.appendChild(mensagem);
                    tbody.appendChild(linha);
                }
                mostrarNotificacao(error.message, 'error');
            }
        });
    </script>
</body>
</html>
