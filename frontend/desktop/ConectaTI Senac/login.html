<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0d4da2">
    <title>Login - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo-senac.png">
</head>
<body class="login-page">
    <div class="login-container">
        <img class="login-logo" src="assets/logo-senac.png" alt="Logo Senac">
        <h1>ConectaTI Senac</h1>
        <p class="subtitle">Faça login para continuar</p>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="min-width: 120px;">
                Tema
            </button>
        </div>
        
        <form id="loginForm" onsubmit="validarLogin(event)">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            
            <div class="form-group">
                <label for="perfil">Perfil</label>
                <select id="perfil" required>
                    <option value="">Selecione seu perfil</option>
                    <option value="Instrutor">Instrutor</option>
                    <option value="Suporte TI">Suporte TI</option>
                    <option value="Coordenacao">Coordenação</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
