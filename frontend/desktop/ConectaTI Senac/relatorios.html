<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0d4da2">
    <title>Relatórios - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo-senac.png">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img class="logo" src="assets/logo-senac.png" alt="Logo Senac">
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="novo-chamado.html">Novo Chamado</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                </div>
            </div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>Relatórios</h1>
                <p>Visualize os relatórios do sistema</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <button class="menu-toggle" onclick="toggleSidebar()">Menu</button>
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" title="Alternar tema">Tema</button>
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div style="padding: 0 24px; display: flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
            <button class="btn btn-primary btn-sm" onclick="gerarRelatorio()">Gerar Relatório</button>
            <button class="btn btn-secondary btn-sm" onclick="filtrarRelatorio()">Filtrar por Mês</button>
            <button class="btn btn-secondary btn-sm" onclick="exportarPDF()">Exportar PDF</button>
        </div>

        <div class="relatorios-grid">
            <div class="relatorio-card">
                <div class="valor">0</div>
                <div class="label">Chamados Resolvidos</div>
            </div>
            <div class="relatorio-card">
                <div class="valor">0</div>
                <div class="label">Chamados Pendentes</div>
            </div>
            <div class="relatorio-card">
                <div class="valor">&mdash;</div>
                <div class="label">Tempo Médio</div>
            </div>
            <div class="relatorio-card">
                <div class="valor">&mdash;</div>
                <div class="label">Notebooks + Solicitados</div>
            </div>
        </div>

        <div class="graficos-grid">
            <div class="grafico">
                <h3>Chamados por Mês</h3>
                <div class="grafico-linha" id="relatorioMensal"></div>
            </div>
            <div class="grafico">
                <h3>Chamados por Categoria</h3>
                <div id="relatorioCategoria"></div>
            </div>
        </div>
    </main>

    <nav class="tab-bar">
        <ul>
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="chamados.html">Chamados</a></li>
            <li><a href="novo-chamado.html">Novo</a></li>
            <li><a href="equipamentos.html">Equip.</a></li>
            <li><a href="relatorios.html" class="active">Relat.</a></li>
            <li><a href="index.html" onclick="fazerLogout();">Sair</a></li>
        </ul>
    </nav>

    <script src="js/script.js"></script>
</body>
</html>
