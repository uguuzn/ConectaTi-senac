<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d4da2">
    <title>Criar Usuário - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo-senac.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .form-criar {
            max-width: 640px;
            margin: 16px 24px;
            padding: 28px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }
        .form-criar .form-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .form-criar .form-header .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            font-size: 1.2rem;
        }
        .form-criar .form-header h1 { font-size: 1.2rem; font-weight: 700; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img class="logo" src="assets/logo-senac.png" alt="Logo Senac">
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                    <div class="user-perfil" id="userUnidade">Unidade</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>👤 Criar Usuário</h1>
                <p>Cadastre um novo usuário no sistema</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <a href="index.html" onclick="fazerLogout();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="form-criar">
            <div class="form-header">
                <div class="icon">👤</div>
                <h1>Novo Usuário</h1>
            </div>

            <form onsubmit="return criarUsuario(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nomeUsuario">Nome Completo</label>
                        <input type="text" id="nomeUsuario" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="emailUsuario">E-mail</label>
                        <input type="email" id="emailUsuario" placeholder="Ex: joao@senac.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="perfilUsuario">Perfil</label>
                        <select id="perfilUsuario" required>
                            <option value="">Selecione...</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                            <option value="TECNICO">Técnico</option>
                            <option value="INSTRUTOR">Instrutor</option>
                            <option value="COORDENADOR">Coordenador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="unidadeUsuario">Unidade</label>
                        <select id="unidadeUsuario">
                            <option value="">Selecione...</option>
                            <option value="Taguatinga">Taguatinga</option>
                            <option value="Brasília">Brasília</option>
                            <option value="Ceilândia">Ceilândia</option>
                            <option value="Gama">Gama</option>
                            <option value="Guará">Guará</option>
                            <option value="Planaltina">Planaltina</option>
                            <option value="Samambaia">Samambaia</option>
                            <option value="Águas Claras">Águas Claras</option>
                            <option value="Asa Norte">Asa Norte</option>
                            <option value="Asa Sul">Asa Sul</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="senhaUsuario">Senha</label>
                        <input type="password" id="senhaUsuario" placeholder="Digite uma senha" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" placeholder="Confirme a senha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="statusUsuario">Status</label>
                    <select id="statusUsuario">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar Usuário</button>
            </form>
        </div>

        <div class="form-criar">
            <div class="form-header">
                <div class="icon">👥</div>
                <h1>Usuários Cadastrados (Demo)</h1>
            </div>
            <div id="listaUsuariosDemo" style="overflow-x:auto;">
                <p style="color:var(--text-muted); font-size:0.9rem;">Nenhum usuário cadastrado localmente ainda.</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
    <script>
        async function criarUsuario(event) {
            event.preventDefault();
            const form = event.target;
            const nome = document.getElementById('nomeUsuario').value.trim();
            const email = document.getElementById('emailUsuario').value.trim();
            const perfil = document.getElementById('perfilUsuario').value;
            const unidade = document.getElementById('unidadeUsuario').value;
            const senha = document.getElementById('senhaUsuario').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const status = document.getElementById('statusUsuario').value;

            if (!nome || !email || !perfil || !senha || !confirmar) {
                mostrarNotificacao('Preencha todos os campos obrigatórios!', 'error');
                return false;
            }

            if (senha !== confirmar) {
                mostrarNotificacao('As senhas não coincidem!', 'error');
                return false;
            }

            if (senha.length < 6) {
                mostrarNotificacao('A senha deve ter pelo menos 6 caracteres!', 'error');
                return false;
            }

            // Tenta o backend; se falhar (sem auth de admin real), salva localmente (demo)
            const usuario = {
                nome, email, senha, telefone: '',
                tipo: perfil, ativo: status === 'true',
                unidade: unidade,
                criadoEm: new Date().toISOString()
            };
            try {
                await ConectaTIAPI.criarUsuario(usuario);
            } catch (error) {
                const res = BancoLocal.salvarUsuario(usuario);
                if (!res.ok) {
                    mostrarNotificacao(res.erro, 'error');
                    return false;
                }
                mostrarNotificacao(`✅ Usuário ${nome} cadastrado com sucesso!`, 'success');
                form.reset();
                renderListaUsuariosDemo();
                return false;
            }

            mostrarNotificacao(`✅ Usuário ${nome} criado com sucesso!`, 'success');
            form.reset();
            renderListaUsuariosDemo();
            return false;
        }

        function renderListaUsuariosDemo() {
            const alvo = document.getElementById('listaUsuariosDemo');
            if (!alvo) return;
            const lista = BancoLocal.listarUsuarios();
            if (!lista.length) {
                alvo.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Nenhum usuário cadastrado localmente ainda.</p>';
                return;
            }
            const perfisLabel = { ADMINISTRADOR:'Administrador', TECNICO:'Técnico', INSTRUTOR:'Instrutor', COORDENADOR:'Coordenador' };
            const linhas = lista.map(u => `
                <tr>
                    <td style="padding:8px 12px; border-bottom:1px solid var(--border-color);">${u.nome}</td>
                    <td style="padding:8px 12px; border-bottom:1px solid var(--border-color);">${u.email}</td>
                    <td style="padding:8px 12px; border-bottom:1px solid var(--border-color);">${perfisLabel[u.tipo] || u.tipo}</td>
                    <td style="padding:8px 12px; border-bottom:1px solid var(--border-color);">${u.unidade || '—'}</td>
                    <td style="padding:8px 12px; border-bottom:1px solid var(--border-color);">${u.ativo ? 'Ativo' : 'Inativo'}</td>
                </tr>`).join('');
            alvo.innerHTML = `
                <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
                    <thead>
                        <tr style="text-align:left; color:var(--text-secondary);">
                            <th style="padding:8px 12px; border-bottom:2px solid var(--border-color);">Nome</th>
                            <th style="padding:8px 12px; border-bottom:2px solid var(--border-color);">E-mail</th>
                            <th style="padding:8px 12px; border-bottom:2px solid var(--border-color);">Perfil</th>
                            <th style="padding:8px 12px; border-bottom:2px solid var(--border-color);">Unidade</th>
                            <th style="padding:8px 12px; border-bottom:2px solid var(--border-color);">Status</th>
                        </tr>
                    </thead>
                    <tbody>${linhas}</tbody>
                </table>`;
        }

        document.addEventListener('DOMContentLoaded', renderListaUsuariosDemo);
    </script>
</body>
</html>
