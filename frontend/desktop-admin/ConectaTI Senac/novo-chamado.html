<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004b8d">
    <title>ConectaTI Senac — Abrir novo chamado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
                <span class="brand-name">ConectaTI <b>Senac</b></span>
            </div>
            <div class="perfil-pill" id="perfilPill">Perfil</div>
            <nav>
                <a href="index.html" data-menu="home">Inicio</a>
                <a href="dashboard.html" data-menu="dashboard">Dashboard</a>
                <a href="chamados.html" data-menu="chamados">Chamados</a>
                <a href="novo-chamado.html" data-menu="novoChamado">Novo chamado</a>
                <a href="equipamentos.html" data-menu="equipamentos">Equipamentos</a>
                <a href="usuarios.html" data-menu="usuarios">Usuarios</a>
                <a href="relatorios.html" data-menu="relatorios">Relatorios</a>
                <a href="unidades.html" data-menu="unidades">Unidades</a>
                <a href="minhas-turmas.html" data-menu="minhasTurmas">Minhas turmas</a>
                <a href="mapa-salas.html" data-menu="mapaSalas">Mapa de salas</a>
                <a href="admin.html" data-menu="administrar">Administracao</a>
                <a href="login.html" class="logout" onclick="sair()">Sair</a>
            </nav>
        </aside>
        <div class="app-main">
            <main class="content">
                <header class="topbar">
                    <div><h1>Abrir novo chamado</h1><p class="muted">Descreva sua solicitacao.</p></div>
                </header>
                <section class="card">
                    <form class="form form-grid" id="formNovoChamado">
                        <label>Titulo<input type="text" id="tituloChamado" required></label>
                        <label>Prioridade
                            <select id="prioridadeChamado">
                                <option value="BAIXA">Baixa</option>
                                <option value="MEDIA" selected>Media</option>
                                <option value="ALTA">Alta</option>
                                <option value="URGENTE">Urgente</option>
                            </select>
                        </label>
                        <label>Categoria<select id="categoriaId" required><option value="">Selecione</option></select></label>
                        <label>Sala (opcional)<select id="salaId"><option value="">Nao informar</option></select></label>
                        <label class="full">Descricao<textarea id="descricaoChamado" rows="5" required></textarea></label>
                        <div class="alerta sucesso full" id="novoChamadoAlerta" style="display:none"></div>
                        <div class="full actions-row"><button type="submit" class="btn btn-primary">Enviar chamado</button></div>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <button class="menu-toggle-floating" id="menuToggleFloating" aria-label="Abrir ou fechar menu">☰</button>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
