<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004b8d">
    <title>ConectaTI Senac — Chamados</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
                <span class="brand-name">ConectaTI <b>Senac</b></span>
            </div>
            <div class="perfil-pill" id="perfilPill">Perfil</div>
            <nav>
                <a href="index.html" data-menu="home">Inicio</a>
                <a href="dashboard.html" data-menu="dashboard">Dashboard</a>
                <a href="chamados.html" data-menu="chamados">Chamados</a>
                <a href="novo-chamado.html" data-menu="novoChamado">Novo chamado</a>
                <a href="equipamentos.html" data-menu="equipamentos">Equipamentos</a>
                <a href="usuarios.html" data-menu="usuarios">Usuarios</a>
                <a href="relatorios.html" data-menu="relatorios">Relatorios</a>
                <a href="unidades.html" data-menu="unidades">Unidades</a>
                <a href="minhas-turmas.html" data-menu="minhasTurmas">Minhas turmas</a>
                <a href="mapa-salas.html" data-menu="mapaSalas">Mapa de salas</a>
                <a href="admin.html" data-menu="administrar">Administracao</a>
                <a href="login.html" class="logout" onclick="sair()">Sair</a>
            </nav>
        </aside>
        <div class="app-main">
            <main class="content">
                <header class="topbar">
                    <div><h1>Chamados</h1><p class="muted">Solicitacoes registradas na API.</p></div>
                    <div class="actions-row"><a href="novo-chamado.html" class="btn btn-primary" id="btnNovoChamado">+ Novo chamado</a></div>
                </header>
                <section class="filters card"><input type="text" id="buscaChamados" placeholder="Buscar chamado..." aria-label="Buscar chamado"></section>
                <p class="alerta erro" id="chamadosErro" style="display:none"></p>
                <section class="card">
                    <div class="table-wrap">
                        <table class="tabela">
                            <thead><tr><th>#</th><th>Titulo</th><th>Solicitante</th><th>Categoria</th><th>Sala</th><th>Prioridade</th><th>Status</th><th>Data</th></tr></thead>
                            <tbody id="listaChamados"></tbody>
                        </table>
                    </div>
                    <p class="muted center" id="chamadosVazio" style="display:none">Nenhum chamado encontrado.</p>
                </section>
            </main>
        </div>
    </div>
    <button class="menu-toggle-floating" id="menuToggleFloating" aria-label="Abrir ou fechar menu">☰</button>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
