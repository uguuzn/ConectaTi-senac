<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004b8d">
    <title>ConectaTI Senac — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
                <span class="brand-name">ConectaTI <b>Senac</b></span>
            </div>
            <div class="perfil-pill" id="perfilPill">Perfil</div>
            <nav>
                <a href="index.html" data-menu="home">Inicio</a>
                <a href="dashboard.html" data-menu="dashboard">Dashboard</a>
                <a href="chamados.html" data-menu="chamados">Chamados</a>
                <a href="novo-chamado.html" data-menu="novoChamado">Novo chamado</a>
                <a href="equipamentos.html" data-menu="equipamentos">Equipamentos</a>
                <a href="usuarios.html" data-menu="usuarios">Usuarios</a>
                <a href="relatorios.html" data-menu="relatorios">Relatorios</a>
                <a href="unidades.html" data-menu="unidades">Unidades</a>
                <a href="minhas-turmas.html" data-menu="minhasTurmas">Minhas turmas</a>
                <a href="mapa-salas.html" data-menu="mapaSalas">Mapa de salas</a>
                <a href="admin.html" data-menu="administrar">Administracao</a>
                <a href="login.html" class="logout" onclick="sair()">Sair</a>
            </nav>
        </aside>
        <div class="app-main">
            <main class="content">
                <header class="topbar">
                    <div><h1>Dashboard</h1><p class="muted">Indicadores calculados a partir dos dados da API.</p></div>
                    <a href="chamados.html" class="btn btn-primary">Ver chamados</a>
                </header>
                <p class="alerta erro" id="dashboardErro" style="display:none"></p>
                <section class="cards-grid">
                    <div class="card kpi"><div><b id="kpiChamados">0</b><small>Chamados</small></div></div>
                    <div class="card kpi"><div><b id="kpiAbertos">0</b><small>Abertos</small></div></div>
                    <div class="card kpi"><div><b id="kpiConcluidos">0</b><small>Concluidos</small></div></div>
                    <div class="card kpi"><div><b id="kpiEquipamentos">0</b><small>Equipamentos</small></div></div>
                </section>
            </main>
        </div>
    </div>
    <button class="menu-toggle-floating" id="menuToggleFloating" aria-label="Abrir ou fechar menu">☰</button>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
