<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConectaTI Senac — Unidades</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">
   <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
   <span class="brand-name">Conecta<b>TI</b></span>
  </div>
  <nav>
   <a href="home.html">Início</a>
   <a href="dashboard.html">Dashboard</a>
   <a href="minhas-turmas.html">Minhas turmas</a>
   <a href="mapa-salas.html">Mapa de salas</a>
   <a href="chamados.html">Chamados</a>
   <a href="novo-chamado.html">Novo chamado</a>
   <a href="equipamentos.html">Equipamentos</a>
   <a href="usuarios.html">Usuários</a>
   <a href="unidades.html" class="active">Unidades</a>
   <a href="relatorios.html">Relatórios</a>
   <a href="login.html" class="logout">Sair</a>
  </nav>
 </aside>

 <main class="content">
  <header class="topbar">
   <button class="menu-toggle" id="menu-toggle">Menu</button>
   <div>
    <h1>Gestão de unidades</h1>
    <p class="muted">Cadastre e gerencie as unidades Senac.</p>
   </div>
   <button class="btn btn-primary" id="btn-nova-unidade">+ Nova unidade</button>
  </header>

  <section class="card reveal">
   <div class="table-wrap">
    <table class="tabela" id="tabela-unidades">
     <thead>
      <tr><th>Nome</th><th>Cidade / DF</th><th>Salas cadastradas</th><th>Ações</th></tr>
     </thead>
     <tbody></tbody>
    </table>
   </div>
  </section>
 </main>

 <div id="modal-unidade" class="modal hidden">
  <div class="modal-card reveal">
   <h3 id="mun-titulo">Nova unidade</h3>
   <form id="form-unidade" class="form">
    <input type="hidden" id="un-id" />
    <label>Nome <input type="text" id="un-nome" placeholder="Ex.: Senac Taguatinga Sul" required /></label>
    <label>Cidade / DF <input type="text" id="un-cidade" placeholder="Ex.: Taguatinga/DF" required /></label>
    <label>Salas cadastradas <input type="number" id="un-salas" min="0" value="10" /></label>
    <div class="modal-actions">
     <button type="button" class="btn btn-ghost" id="un-cancelar">Cancelar</button>
     <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
   </form>
  </div>
 </div>

 <script src="js/script.js"></script>
</body>
</html>
