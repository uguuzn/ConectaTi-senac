<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConectaTI Senac — Chamados</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app">
 <aside class="sidebar" id="sidebar">
 <div class="brand">
 <img src="assets/logo-senac.png" alt="Logo Senac" class="logo" />
 <span class="brand-name">Conecta<b>TI</b></span>
 </div>
 <nav>
 <a href="home.html">Início</a>
 <a href="dashboard.html">Dashboard</a>
 <a href="chamados.html" class="active">Chamados</a>
 <a href="novo-chamado.html">Novo chamado</a>
 <a href="equipamentos.html">Equipamentos</a>
 <a href="relatorios.html">Relatórios</a>
 <a href="minhas-turmas.html">Minhas turmas</a>
 <a href="mapa-salas.html">Mapa de salas</a>
 <a href="usuarios.html">Usuários</a>
 <a href="unidades.html">Unidades</a>
 <a href="login.html" class="logout">Sair</a>
 </nav>
 </aside>

 <main class="content">
 <header class="topbar">
 <button class="menu-toggle" id="menu-toggle">Menu</button>
 <div>
 <h1>Chamados</h1>
 <p class="muted">Acompanhe e filtre todas as solicitações.</p>
 </div>
 <a href="novo-chamado.html" class="btn btn-primary">+ Novo chamado</a>
 </header>

 <section class="filters card reveal">
 <input type="text" id="busca" placeholder="Buscar solicitante..." />
 <select id="filtro-status">
 <option value="">Todos os status</option>
 <option>Aberto</option>
 <option>Em atendimento</option>
 <option>Aguardando</option>
 <option>Resolvido</option>
 <option>Atrasado</option>
 </select>
 <select id="filtro-prioridade">
 <option value="">Toda prioridade</option>
 <option>Baixa</option>
 <option>Média</option>
 <option>Alta</option>
 <option>Urgente</option>
 </select>
 <select id="filtro-categoria">
 <option value="">Toda categoria</option>
 <option>Notebook</option>
 <option>Projetor</option>
 <option>Internet/Rede</option>
 <option>Impressora</option>
 <option>Software</option>
 </select>
 </section>

 <section class="card reveal">
 <div class="table-wrap">
 <table class="tabela" id="tabela-chamados">
 <thead>
 <tr>
 <th>Nº</th><th>Solicitante</th><th>Perfil</th><th>Categoria</th>
 <th>Sala</th><th>Prioridade</th><th>Status</th><th>Data</th>
 </tr>
 </thead>
 <tbody>
 <!-- populado via JS -->
 </tbody>
 </table>
 </div>
 <p id="vazio" class="muted center hidden">Nenhum chamado encontrado.</p>
 </section>
 </main>

 <script src="js/script.js"></script>
</body>
</html>
