version: "3.8"

services:
  db-locadora:
    image: postgres:16-alpine
    container_name: db-locadora
    restart: unless-stopped
    environment:
      POSTGRES_DB: locadora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - db_locadora_data:/var/lib/postgresql/data

volumes:
  db_locadora_data:
